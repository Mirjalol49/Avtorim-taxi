[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_ENABLED = "false"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."daily-plan-debt-reminder"]
  schedule = "0 17 * * *"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
